# Builds the Play Store bundle (.aab) on GitHub's machines and attaches it to the run.
# Download it from the run's page, under "Artifacts" (Actions tab → the run → release-aab).
#
# Signing uses four repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    the upload keystore (.jks), base64-encoded
#   KEYSTORE_PASSWORD  its store password
#   KEY_ALIAS          the key's alias (upload)
#   KEY_PASSWORD       the key's password
# Without them the bundle is built unsigned (to check the release build), and Play won't take it.
name: Release bundle

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: CasCalc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # The keystore and its passwords come from the secrets; they're written only on the runner,
      # into the files build.gradle.kts reads (both are in .gitignore), and never printed.
      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: the bundle is unsigned and can't be uploaded to Play."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build the release bundle
        run: gradle bundleRelease --stacktrace

      - name: Check the signature
        run: |
          if [ -f keystore.properties ]; then jarsigner -verify app/build/outputs/bundle/release/*.aab | tail -1; fi

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: |
            CasCalc/app/build/outputs/bundle/release/*.aab
            CasCalc/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Remove the keystore
        if: always()
        run: rm -f upload-keystore.jks keystore.properties
