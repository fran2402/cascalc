.top{height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;color:var(--onv)}
.disp{flex:1;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;padding:0 12px 6px}
.card{flex-shrink:0;background:var(--card);border-radius:24px;padding:14px 20px;margin-top:8px}
.cexpr{color:var(--onv);font-size:24px}
.cres{display:flex;align-items:center;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:5px 14px 5px 8px;font-size:15px;font-weight:500;background:var(--pc);color:var(--onpc)}
.chip.on{background:var(--pri);color:var(--onpri)}
.eqs{margin-left:auto;color:var(--pri);font-size:26px;margin-right:12px;font-family:CMR}
.res{font-size:30px}
.input{flex-shrink:0;text-align:right;padding:10px 12px 0;font-size:42px;white-space:nowrap}
.prev{text-align:right;padding:2px 12px 6px;color:var(--onv);font-size:22px;min-height:34px;flex-shrink:0}
.ctrl{height:46px;display:flex;align-items:center;padding:0 12px;color:var(--onv);gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;height:32px;font-size:13px;font-weight:500}
.seg span{padding:0 14px;display:flex;align-items:center}
.seg .sel{background:var(--sec);color:var(--onsec)}
.tabs{display:flex;gap:6px;padding:2px 12px 6px;font-size:14px;font-weight:500;color:var(--onv);white-space:nowrap}
.tabs>span{color:inherit;height:34px;padding:0 15px;border-radius:99px;display:flex;align-items:center}
.tabs .sel{background:var(--sec);color:var(--onsec)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 8px}
.k{border-radius:99px;display:flex;align-items:center;justify-content:center;font-variation-settings:"ROND" 100}
.fn{height:44px;background:var(--sec);color:var(--onsec);font-size:19px}
.mk{height:58px;font-size:29px}
.d{background:var(--dig);color:var(--on)} .o{background:var(--sec);color:var(--onsec)} .ac{background:var(--pc);color:var(--onpc);font-size:26px} .eq{background:var(--eq);color:var(--oneq)}
.main{margin-top:20px;margin-bottom:14px}
.pressed{border-radius:28%}
svg.mv{display:inline-block}
.tabs svg.mv{max-height:26px;max-width:42px;width:auto;height:auto}
.tabs>span{font-size:20px}
.mk svg.mv,.fn svg.mv{display:block;max-height:80%;max-width:80%;width:auto;height:auto}

  h+=`<div class="tabs">${TABS.map((t,i)=>`<span class="${i==o.tab?'sel':''}" style="width:52px;padding:0;justify-content:center">${label(t,i==o.tab?P.onsec:P.onv,20)}</span>`).join('')}</div>`;
  const rowsT=TABKEYS[o.tab],cols=rowsT[0].length,tall=rowsT.length>3;
  h+=`<div style="position:relative;${tall?'height:173px;overflow:hidden':''}"><div class="grid" style="grid-template-columns:repeat(${cols},1fr);${o.scroll?`transform:translateY(-${o.scroll}px)`:''}">${rowsT.flat().map((k,idx)=>`<div class="k fn" style="position:relative">${label(k,P.onsec,18)}${o.hint&&o.hint[0]==idx?`<span style="position:absolute;bottom:52px;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:99px;padding:8px 14px;background:var(--inv);color:var(--oninv);font:14px GSF;z-index:3">${o.hint[1]}</span>`:''}</div>`).join('')}</div>${tall?'<div style="position:absolute;left:0;right:0;bottom:0;height:18px;background:linear-gradient(transparent,var(--bg))"></div>':''}</div>`;
  if(o.sheet){const u=['SI','Planck','Atomic','Natural'].indexOf(o.units||'SI');
   h+=`<div style="position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:5"><div style="position:absolute;left:0;right:0;bottom:0;height:600px;border-radius:28px 28px 0 0;background:var(--dig);overflow:hidden;color:var(--on)">
    <div style="width:32px;height:4px;border-radius:2px;background:var(--onv);opacity:.4;margin:12px auto 10px"></div>
    <div style="font:18px GSF;padding:4px 24px 10px">Physical constants · ${o.units||'SI'} units</div>
    ${CONSTS_ALL.slice(o.sheetFrom||0,(o.sheetFrom||0)+9).map(c=>`<div style="display:flex;align-items:center;padding:10px 24px">
      <span style="width:72px">${mv(R(cst(c.id)),22,P.on)}</span>
      <span style="flex:1"><div style="font:15px GSF">${c.d}</div><div style="display:flex;align-items:center;gap:6px">${mv(MT.decode(c.v[u]),15,P.onv)}${u==0&&c.u?`<span style="font:13px GSF;color:var(--onv)">${c.u}</span>`:''}</div></span>
      ${c.exact&&u==0?'<span style="font:13px GSF;color:var(--pri)">exact</span>':''}</div>`).join('')}</div></div>`}
  if(o.settings)h+=`<div style="position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:5">
   <div style="width:320px;border-radius:28px;background:var(--dig);padding:24px;color:var(--on)">
   <div style="font:400 24px GSF;margin-bottom:18px">Settings</div>
   <div style="font:16px GSF">Decimal places: 10 significant digits</div>
   <div style="position:relative;height:44px;display:flex;align-items:center;margin:4px 0 14px"><span style="position:absolute;left:0;right:0;height:16px;border-radius:8px;background:var(--sec)"></span><span style="position:absolute;left:0;width:54%;height:16px;border-radius:8px 2px 2px 8px;background:var(--pri)"></span><span style="position:absolute;left:calc(54% + 3px);width:4px;height:44px;border-radius:2px;background:var(--pri)"></span></div>
   <div style="display:flex;align-items:center"><div style="flex:1"><div style="font:16px GSF">Show decimals first</div><div style="font:13px GSF;color:var(--onv)">The exact form stays one tap away</div></div>
   <span style="width:52px;height:32px;border-radius:16px;border:2px solid var(--outv);display:flex;align-items:center;padding-left:6px;box-sizing:border-box"><span style="width:16px;height:16px;border-radius:50%;background:var(--onv)"></span></span></div>
   <div style="text-align:right;margin-top:20px;font:500 15px GSF;color:var(--pri)">Done</div></div></div>`;
  const MK=[['AC','ac'],['( )','o'],[`<span style="font-family:CMI">x</span>`,'o'],['÷','o'],['7','d'],['8','d'],['9','d'],['×','o'],['4','d'],['5','d'],['6','d'],['−','o'],['1','d'],['2','d'],['3','d'],['+','o'],['0','d'],['.','d'],[I.bs,'d'],['=','eq']];
  h+=`<div class="grid main">${MK.map(([l,c])=>`<div class="k mk ${c}">${l}</div>`).join('')}</div>`;
 } else h+='<div style="height:30px"></div></div>';
 p.innerHTML=h;document.body.appendChild(p);
}
const sinx=R(func('sin',R('x')));

// ---- Graph screens (Graph2DScreen.kt / Graph3DScreen.kt / GraphCommon.kt), drawn from engine output in graphs.js
const PLOT={dark:['#C5CB86','#FFE3C0','#4C8DF6','#E8710A','#1E9E54','#FFB4AB'],light:['#5B6133','#7A5A2C','#4C8DF6','#E8710A','#1E9E54','#BA1A1A']};
const hex=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
function svg2d(d,theme){
 const pal=PLOT[theme],on=theme=='dark'?'#C8C7B5':'#47473B',grid=theme=='dark'?'71,71,59':'200,199,181',bg=theme=='dark'?'#12130C':'#FCF9EE';
 let o=`<svg width="${d.w}" height="${d.h}" style="display:block">`;
 d.minorX.forEach(x=>o+=`<line x1="${x}" y1="0" x2="${x}" y2="${d.h}" stroke="rgba(${grid},.35)" stroke-width="1"/>`);
 d.minorY.forEach(y=>o+=`<line x1="0" y1="${y}" x2="${d.w}" y2="${y}" stroke="rgba(${grid},.35)" stroke-width="1"/>`);
 d.majorX.forEach(([x])=>o+=`<line x1="${x}" y1="0" x2="${x}" y2="${d.h}" stroke="rgba(${grid},.9)" stroke-width="1.2"/>`);
 d.majorY.forEach(([y])=>o+=`<line x1="0" y1="${y}" x2="${d.w}" y2="${y}" stroke="rgba(${grid},.9)" stroke-width="1.2"/>`);
 const [ox,oy]=d.origin;
 o+=`<line x1="0" y1="${oy}" x2="${d.w}" y2="${oy}" stroke="${on}" stroke-width="2"/><line x1="${ox}" y1="0" x2="${ox}" y2="${d.h}" stroke="${on}" stroke-width="2"/>`;
 const ly=Math.min(Math.max(oy,2),d.h-16),lx=Math.min(Math.max(ox,2),d.w-40);
 d.majorX.forEach(([x,t])=>{if(t)o+=`<text x="${x}" y="${ly+14}" text-anchor="middle" font-size="11" fill="${on}" style="font-family:GSF;font-weight:500">${t}</text>`});
 d.majorY.forEach(([y,t])=>{if(t)o+=`<text x="${lx+4}" y="${y+4}" font-size="11" fill="${on}" style="font-family:GSF;font-weight:500">${t}</text>`});
 d.curves.forEach(c=>c.lines.forEach(l=>o+=`<polyline points="${l.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${pal[c.c]}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`));
 d.points.forEach(([x,y,c])=>o+=`<circle cx="${x}" cy="${y}" r="5" fill="${bg}" stroke="${pal[c]}" stroke-width="2"/>`);
 if(d.trace){const t=d.trace;cv0.font='13px GSF';const tw=cv0.measureText(t.text).width;const w=tw+16,h=31;
  const left=Math.min(Math.max(t.x-w/2,4),d.w-w-4),top=t.y-h-14>0?t.y-h-14:t.y+14;
  o+=`<circle cx="${t.x}" cy="${t.y}" r="7" fill="${pal[t.c]}"/><circle cx="${t.x}" cy="${t.y}" r="3" fill="var(--inv)"/>`;
  if(!d.useBubble)o+=`<rect x="${left}" y="${top}" width="${w}" height="${h}" rx="${h/2}" fill="var(--inv)"/><text x="${left+8}" y="${top+20}" font-size="13" fill="var(--oninv)" style="font-family:GSF">${t.text}</text>`}
 return o+'</svg>';
}
const cv0=document.createElement('canvas').getContext('2d');
function svg3d(d,theme){
 const pal=PLOT[theme],grid=theme=='dark'?'#47473B':'#C8C7B5',on=theme=='dark'?'#E5E3D6':'#1C1C16';
 let o=`<svg width="${d.w}" height="${d.h}" style="display:block">`;
 d.box.forEach(([a,b,c,e])=>o+=`<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="${grid}" stroke-width="1"/>`);
 d.faces.forEach(f=>{const [x0,y0,x1,y1,x2,y2,x3,y3,shade,hgt,s]=f;const c=hex(pal[s]);
  const lo=mix(c,[0,0,0],.35),hi=mix(c,[255,255,255],.45),b=mix(lo,hi,hgt).map(v=>Math.round(v*shade));
  o+=`<path d="M${x0} ${y0}L${x1} ${y1}L${x2} ${y2}L${x3} ${y3}Z" fill="rgb(${b})" stroke="${on}" stroke-opacity=".12" stroke-width=".6"/>`});
 d.labels.forEach(([n,x,y])=>o+=`<text x="${x}" y="${y+6}" text-anchor="middle" font-size="18" fill="var(--onv)" style="font-family:CMI">${n}</text>`);
 o+=`<text x="${d.w-12}" y="24" text-anchor="end" font-size="11" fill="var(--onv)" style="font-family:GSF">z max ${d.zmax}</text><text x="${d.w-12}" y="39" text-anchor="end" font-size="11" fill="var(--onv)" style="font-family:GSF">z min ${d.zmin}</text>`;
 return o+'</svg>';
}
function fnRow(code,c,out,active){
 const r=MT.decode(code);const cur=active?{cursorRow:r,cursorIndex:r.length}:{};
 return `<div style="display:flex;align-items:center;border-radius:20px;background:${active?'var(--dig)':'var(--card)'};padding:6px 4px 6px 8px">
  <span style="width:40px;display:flex;justify-content:center"><span style="width:18px;height:18px;border-radius:50%;background:${PLOT[P==PAL.dark?'dark':'light'][c]}"></span></span>
  <span style="font-family:CMI;font-size:24px;color:var(--onv);margin-right:8px">${out} =</span>
  <span style="flex:1;overflow:hidden">${mv(r,26,P.on,cur)}</span>
  <span style="width:48px;display:flex;justify-content:center;color:var(--onv)">${icon('Close',24)}</span></div>`}
function slider(name,val,pct){
 return `<div style="display:flex;align-items:center;padding:0 8px;gap:8px"><span style="font-family:CMI;font-size:22px;width:28px">${name}</span>
  <span style="flex:1;position:relative;height:44px;display:flex;align-items:center"><span style="position:absolute;left:0;right:0;height:16px;border-radius:8px;background:var(--sec)"></span>
  <span style="position:absolute;left:0;width:${pct}%;height:16px;border-radius:8px 2px 2px 8px;background:var(--pri)"></span>
  <span style="position:absolute;left:calc(${pct}% + 3px);width:4px;height:44px;border-radius:2px;background:var(--pri)"></span></span>
  <span style="font-family:CMR;font-size:18px;width:40px;color:var(--onv)">${val}</span></div>`}
function addBtn(out){return `<span style="align-self:flex-start;display:flex;align-items:center;gap:8px;border-radius:99px;background:var(--sec);color:var(--onsec);padding:10px 16px">${icon('Add',20)}<span style="font-family:CMI;font-size:18px">${out} =</span></span>`}
function compactKeys(){
 const MK=[['AC','ac'],['( )','o'],[`<span style="font-family:CMI">x</span>`,'o'],['÷','o'],['7','d'],['8','d'],['9','d'],['×','o'],['4','d'],['5','d'],['6','d'],['−','o'],['1','d'],['2','d'],['3','d'],['+','o'],['0','d'],['.','d'],[I.bs,'d'],['=','eq']];
 return `<div class="ctrl">${I.fold.replace('M7.41 18.59','M7.41 18.59')}<span class="seg"><span class="sel">Rad</span><span>Deg</span></span><span style="margin-left:auto">${I.left}</span>${I.right}</div>
  <div class="grid main" style="margin-top:0">${MK.map(([l,c])=>`<div class="k mk ${c}" style="height:48px;font-size:26px">${l}</div>`).join('')}</div>`}
function phoneG2(theme,d,rows,o={}){
 P=PAL[theme];const p=document.createElement('div');p.className='phone '+theme;
 let h=`<div class="status"><span>12:30</span><span>▾ ▴ ▮</span></div>${topRow(1,`<span style="color:var(--onv)">${icon('Focus',24)}</span>`,'')}`;
 d.useBubble=!!o.useBubble;
 let bubble='';
 if(o.useBubble&&d.trace){const t=d.trace;const chip=n=>`<span style="margin-left:6px;border-radius:99px;padding:6px 12px;background:var(--pri);color:var(--inv);font:13px GSF">Use ${n}</span>`;
  bubble=`<span style="position:absolute;left:${Math.max(8,Math.min(d.w-330,t.x-165))}px;top:${t.y-58}px;display:flex;align-items:center;border-radius:99px;padding:4px 4px 4px 14px;background:var(--inv);color:var(--oninv);font:13px GSF;white-space:nowrap">${t.text}${chip('x')}${chip('y')}</span>`}
 h+=`<div style="height:${d.h}px;overflow:hidden;position:relative">${svg2d(d,theme)}${bubble}</div>`;
 h+=`<div style="display:flex;flex-direction:column;gap:6px;padding:6px 12px">${rows.map(([code,c,act])=>fnRow(code,c,'y',act)).join('')}${(o.sliders||[]).map(s=>slider(...s)).join('')}${o.keys?'':addBtn('y')}</div>`;
 if(o.keys)h+=compactKeys();
 p.innerHTML=h;document.body.appendChild(p)}
function phoneG3(theme,d,rows){
 P=PAL[theme];const p=document.createElement('div');p.className='phone '+theme;
 let h=`<div class="status"><span>12:30</span><span>▾ ▴ ▮</span></div>${topRow(2,`<span style="color:var(--onv)">${icon('Rotate',24)}</span>`,'')}`;
 h+=`<div style="height:${d.h}px;position:relative;overflow:hidden">${svg3d(d,theme)}
   <span style="position:absolute;left:12px;bottom:12px;display:flex;align-items:center;border-radius:99px;background:var(--dig);color:var(--on)">
   <span style="width:48px;height:48px;display:flex;align-items:center;justify-content:center">${icon('Remove',24)}</span><span style="font-family:CMR;font-size:16px">x, y ∈ [−3, 3]</span><span style="width:48px;height:48px;display:flex;align-items:center;justify-content:center">${icon('Add',24)}</span></span></div>`;
 h+=`<div style="display:flex;flex-direction:column;gap:6px;padding:6px 12px">${rows.map(([code,c])=>fnRow(code,c,'z',false)).join('')}${addBtn('z')}</div>`;
 p.innerHTML=h;document.body.appendChild(p)}
