<!-- Icon options for CasCalc: six directions, each shown as Android draws it. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:GSF;src:url(../app/src/main/res/font/google_sans_flex.ttf);font-weight:1 1000}
@font-face{font-family:CMR;src:url(../app/src/main/res/font/cm_main.otf)}
@font-face{font-family:CMI;src:url(../app/src/main/res/font/cm_italic.otf)}
@font-face{font-family:CMS2;src:url(../app/src/main/res/font/cm_size2.otf)}
body{margin:0;background:#e9e5dc;font-family:GSF;padding:40px;color:#23221c}
h1{font:500 34px GSF;margin:0 0 6px} .sub{font:16px GSF;color:#5c5a50;margin-bottom:30px}
.opt{display:flex;align-items:center;gap:34px;background:#f7f4ec;border-radius:32px;padding:26px 30px;margin-bottom:22px}
.meta{width:300px} .meta b{font:600 26px GSF;display:block;margin-bottom:6px} .meta span{font:15px GSF;color:#5c5a50;line-height:1.4}
.col{display:flex;flex-direction:column;align-items:center;gap:8px;font:12px GSF;color:#6b695e}
.circle{clip-path:circle(50%)} .squircle{clip-path:url(#sq)} .rsq{border-radius:22%;overflow:hidden}
.home{width:250px;height:150px;border-radius:22px;background:linear-gradient(135deg,#6f7fa8,#c79b8b 60%,#e7c38e);display:flex;align-items:center;justify-content:space-around;padding:0 10px}
.home.dark{background:linear-gradient(135deg,#1f2433,#3b2f3a)}
.mini{width:52px;height:52px;border-radius:50%;overflow:hidden}
.fake{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.55)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><clipPath id="sq" clipPathUnits="objectBoundingBox"><path d="M.5 0C.9 0 1 .1 1 .5S.9 1 .5 1 0 .9 0 .5.1 0 .5 0z"/></clipPath></svg>
<h1>CasCalc icon: H5 with maths</h1>
<div class="sub">Each row: full colour in a circle mask and a squircle mask, the themed icon (Android 13+ monochrome) in light and dark, and at real size on a home screen. Glyphs are Computer Modern, like the app's maths.</div>
<div id="list"></div>
<script>
// Each option: fg(theme) = the foreground layer (108×108, content inside the 66 dp safe zone, 21–87),
// bg = the background layer, mono = the one-colour version (drawn in currentColor).
const W='http://www.w3.org/2000/svg';
const T=(x,y,s,f,t,fill,extra='')=>`<text x="${x}" y="${y}" font-family="${f}" font-size="${s}" fill="${fill}" text-anchor="middle" ${extra}>${t}</text>`;
// The saddle z = x² − y² over a square, seen from azimuth 0.6 rad and elevation asin 0.55 (chosen
// from a contact sheet of views: the one where the saddle reads at a glance).
const AZ=.6,ZK=.8,EL=.55,CA=Math.cos(AZ),SA=Math.sin(AZ),CE=Math.sqrt(1-EL*EL),S=24;
const P0=(x,y)=>{const z=(x*x-y*y)*ZK;const sx=x*CA-y*SA,dp=x*SA+y*CA;return [sx,dp*EL-z*CE]};
// Centred on its own bounds and scaled to 58 units across (inside the 66 dp safe zone).
const BB=(()=>{let a=[1e9,1e9,-1e9,-1e9];for(let i=0;i<=40;i++)for(let j=0;j<=40;j++){const q=P0(-1+i/20,-1+j/20);a=[Math.min(a[0],q[0]),Math.min(a[1],q[1]),Math.max(a[2],q[0]),Math.max(a[3],q[1])]}return a})();
const SC=58/Math.max(BB[2]-BB[0],BB[3]-BB[1]);
const P=(x,y,k=1)=>{const q=P0(x,y);return [54+(q[0]-(BB[0]+BB[2])/2)*SC*k,54+(q[1]-(BB[1]+BB[3])/2)*SC*k]};
const depth=(x,y)=>x*SA+y*CA;
const f2=p=>p.map(v=>v.toFixed(1)).join(' ');
const edge=(n=24,k=1)=>{let d='';const add=(x,y,f)=>{d+=(f?'M':'L')+f2(P(x,y,k))};
 for(let i=0;i<=n;i++)add(-1+2*i/n,-1,i==0);for(let i=1;i<=n;i++)add(1,-1+2*i/n);for(let i=1;i<=n;i++)add(1-2*i/n,1);for(let i=1;i<n;i++)add(-1,1-2*i/n);return d+'Z'};
const uLine=(y,k=1,n=30)=>{let d='';for(let i=0;i<=n;i++)d+=(i?'L':'M')+f2(P(-1+2*i/n,y,k));return d};
const vLine=(x,k=1,n=30)=>{let d='';for(let i=0;i<=n;i++)d+=(i?'L':'M')+f2(P(x,-1+2*i/n,k));return d};
const grid=(m,stroke,w,k=1)=>{let g='';for(let i=1;i<m;i++){const c=-1+2*i/m;g+=`<path d="${uLine(c,k)}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"/><path d="${vLine(c,k)}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"/>`}return g};
// Cells coloured by the side they show (top light, underside darker), drawn back to front.
const faces=(top,under,k=1,n=18)=>{const q=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++){const x0=-1+2*i/n,x1=-1+2*(i+1)/n,y0=-1+2*j/n,y1=-1+2*(j+1)/n;
 const a=P(x0,y0,k),b=P(x1,y0,k),c=P(x1,y1,k),d=P(x0,y1,k);const cr=(b[0]-a[0])*(d[1]-a[1])-(b[1]-a[1])*(d[0]-a[0]);
 q.push({d:depth((x0+x1)/2,(y0+y1)/2),p:[a,b,c,d],up:cr>0})}q.sort((x,y)=>x.d-y.d);
 return q.map(o=>`<path d="M${o.p.map(f2).join('L')}Z" fill="${o.up?top:under}" stroke="${o.up?top:under}" stroke-width=".5"/>`).join('')};
// H5 at scale k, moved by (dx, dy): the dim surface and the two coloured curves.
const MINT='#8BE9C9',GOLD='#FFD27A',INK='#E6F4F1';
const at=(k,dx,dy,body)=>`<g transform="translate(${54+dx} ${54+dy}) scale(${k}) translate(-54 -54)">${body}</g>`;
const h5=(k=1,dx=0,dy=0)=>at(k,dx,dy,faces('#2F6F7E','#1E4D5C')+`<path d="${edge()}" fill="none" stroke="${MINT}" stroke-width="1.6" stroke-linejoin="round" opacity=".6"/><path d="${uLine(0)}" fill="none" stroke="${MINT}" stroke-width="${3.4/k}" stroke-linecap="round"/><path d="${vLine(0)}" fill="none" stroke="${GOLD}" stroke-width="${3.4/k}" stroke-linecap="round"/>`);
const h5m=(k=1,dx=0,dy=0)=>at(k,dx,dy,`<path d="${edge()}" fill="none" stroke="currentColor" stroke-width="${2.4/k}" stroke-linejoin="round"/><path d="${uLine(0)}" fill="none" stroke="currentColor" stroke-width="${3.4/k}" stroke-linecap="round"/><path d="${vLine(0)}" fill="none" stroke="currentColor" stroke-width="${3.4/k}" stroke-linecap="round"/>`);
// A point of the surface after at(k, dx, dy).
const Q=(x,y,k=1,dx=0,dy=0)=>{const p=P(x,y);return [54+dx+(p[0]-54)*k,54+dy+(p[1]-54)*k]};
// Maths in Computer Modern: italic letters, upright digits and signs.
const M=(x,y,size,fill,parts,anchor='middle')=>`<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}">${parts}</text>`;
const it=t=>`<tspan font-family="CMI">${t}</tspan>`, rm=t=>`<tspan font-family="CMR">${t}</tspan>`, sup=t=>`<tspan font-family="CMR" font-size="68%" dy="-5">${t}</tspan><tspan dy="5"> </tspan>`;
const eq=`${it('z')}${rm(' = ')}${it('x')}${sup('2')}${rm('− ')}${it('y')}${sup('2')}`;
const O=[
{name:'H5 · As it is', note:'The base: dim surface, the curve that bends up (mint) and the one that bends down (gold).',
 bg:'#0E2A3A', fg:h5(), mono:h5m()},
{name:'H5a · With its equation', note:'The saddle’s own equation, z = x² − y², set in Computer Modern under the surface. Says exactly what is drawn.',
 bg:'#0E2A3A',
 fg:h5(.82,0,-7)+M(54,80,10.5,INK,eq),
 mono:h5m(.82,0,-7)+M(54,80,10.5,'currentColor',eq)},
{name:'H5b · Axis letters', note:'Small italic x, y and z where the curves end and above the surface: the colours tie each letter to its curve.',
 bg:'#0E2A3A',
 fg:(()=>{const k=.84,dy=2,ex=Q(1,0,k,0,dy),ey=Q(0,1,k,0,dy),o=Q(0,0,k,0,dy);return h5(k,0,dy)+M(ex[0]+5,ex[1]-3,12,MINT,it('x'),'start')+M(ey[0]-6,ey[1]+8,12,GOLD,it('y'),'end')+`<path d="M${o[0]} ${o[1]-6}V${o[1]-26}" stroke="${INK}" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>`+M(o[0]+5,o[1]-24,12,INK,it('z'),'start')})(),
 mono:(()=>{const k=.84,dy=2,ex=Q(1,0,k,0,dy),ey=Q(0,1,k,0,dy),o=Q(0,0,k,0,dy);return h5m(k,0,dy)+M(ex[0]+5,ex[1]-3,12,'currentColor',it('x'),'start')+M(ey[0]-6,ey[1]+8,12,'currentColor',it('y'),'end')+`<path d="M${o[0]} ${o[1]-6}V${o[1]-26}" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>`+M(o[0]+5,o[1]-24,12,'currentColor',it('z'),'start')})()},
{name:'H5c · ∇f = 0', note:'A dot where the curves cross (the saddle point) labelled ∇f = 0: the condition that makes it a critical point.',
 bg:'#0E2A3A',
 fg:(()=>{const k=.86,dy=4,o=Q(0,0,k,0,dy);return h5(k,0,dy)+`<circle cx="${o[0]}" cy="${o[1]}" r="3.4" fill="#fff"/>`+M(54,27,11,INK,`${rm('∇')}${it('f')}${rm(' = 0')}`)})(),
 mono:(()=>{const k=.86,dy=4,o=Q(0,0,k,0,dy);return h5m(k,0,dy)+`<circle cx="${o[0]}" cy="${o[1]}" r="3.6" fill="currentColor"/>`+M(54,27,11,'currentColor',`${rm('∇')}${it('f')}${rm(' = 0')}`)})()},
{name:'H5d · Curvature signs', note:'A small “+” by the mint curve and “−” by the gold one: the second derivatives, ∂²f/∂x² > 0 and ∂²f/∂y² < 0. The whole idea of a saddle in two characters.',
 bg:'#0E2A3A',
 fg:(()=>{const k=.9,ex=Q(1,0,k),ey=Q(0,1,k);return h5(k)+M(ex[0]+3,ex[1]-6,15,MINT,rm('+'),'start')+M(ey[0]-3,ey[1]+10,15,GOLD,rm('−'),'end')})(),
 mono:(()=>{const k=.9,ex=Q(1,0,k),ey=Q(0,1,k);return h5m(k)+M(ex[0]+3,ex[1]-6,15,'currentColor',rm('+'),'start')+M(ey[0]-3,ey[1]+10,15,'currentColor',rm('−'),'end')})()},
{name:'H5e · Partial derivatives', note:'∂ₓ and ∂ᵧ in the curve colours at the curves’ ends: partial derivatives are what the two curves show. Compact and very “CAS”.',
 bg:'#0E2A3A',
 fg:(()=>{const k=.84,dy=2,ex=Q(1,0,k,0,dy),ey=Q(0,1,k,0,dy);return h5(k,0,dy)+M(ex[0]+3,ex[1]-4,12.5,MINT,`${rm('∂')}<tspan font-family="CMI" font-size="70%" dy="3">x</tspan>`,'start')+M(ey[0]-2,ey[1]+10,12.5,GOLD,`${rm('∂')}<tspan font-family="CMI" font-size="70%" dy="3">y</tspan>`,'end')})(),
 mono:(()=>{const k=.84,dy=2,ex=Q(1,0,k,0,dy),ey=Q(0,1,k,0,dy);return h5m(k,0,dy)+M(ex[0]+3,ex[1]-4,12.5,'currentColor',`${rm('∂')}<tspan font-family="CMI" font-size="70%" dy="3">x</tspan>`,'start')+M(ey[0]-2,ey[1]+10,12.5,'currentColor',`${rm('∂')}<tspan font-family="CMI" font-size="70%" dy="3">y</tspan>`,'end')})()},
{name:'H5f · Equation in a key', note:'The surface above a small rounded key holding z = x² − y², like the app’s input line: graph and calculator together.',
 bg:'#0E2A3A',
 fg:h5(.76,0,-9)+`<rect x="30" y="70" width="48" height="15" rx="7.5" fill="#1C4659"/>`+M(54,81,9.5,INK,eq),
 mono:h5m(.76,0,-9)+`<rect x="30" y="70" width="48" height="15" rx="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/>`+M(54,81,9.5,'currentColor',eq)},
{name:'H5g · Light, with equation', note:'H5a on a pale tile: deep teal surface, the curves in teal and amber, the equation in dark ink. Closest to a Material You icon.',
 bg:'#E3F4EE',
 fg:at(.82,0,-7,faces('#9FD8C8','#6FB5AA')+`<path d="${edge()}" fill="none" stroke="#0F5C4D" stroke-width="1.6" stroke-linejoin="round" opacity=".6"/><path d="${uLine(0)}" fill="none" stroke="#0F6B57" stroke-width="4.1" stroke-linecap="round"/><path d="${vLine(0)}" fill="none" stroke="#C0780F" stroke-width="4.1" stroke-linecap="round"/>`)+M(54,80,10.5,'#10322A',eq),
 mono:h5m(.82,0,-7)+M(54,80,10.5,'currentColor',eq)},
];



const svg=(bg,fg,size,cls='')=>`<svg class="${cls}" xmlns="${W}" viewBox="0 0 108 108" width="${size}" height="${size}"><rect width="108" height="108" fill="${bg}"/>${fg}</svg>`;
// Themed icons: Material You tints (light: dark ink on pale; dark: pale ink on dark).
const mono=(o,size,dark)=>`<svg xmlns="${W}" viewBox="0 0 108 108" width="${size}" height="${size}" style="color:${dark?'#D4E3FF':'#1D3A66'};--mbg:${dark?'#2A3446':'#D6E3FF'}"><rect width="108" height="108" fill="${dark?'#2A3446':'#D6E3FF'}"/>${o.mono}</svg>`;
document.getElementById('list').innerHTML=O.map(o=>`<div class="opt"><div class="meta"><b>${o.name}</b><span>${o.note}</span></div>
 <div class="col">${svg(o.bg,o.fg,190,'circle')}Circle</div>
 <div class="col">${svg(o.bg,o.fg,190,'squircle')}Squircle</div>
 <div class="col"><div class="circle" style="width:120px;height:120px">${mono(o,120,false)}</div>Themed, light</div>
 <div class="col"><div class="circle" style="width:120px;height:120px">${mono(o,120,true)}</div>Themed, dark</div>
 <div class="col"><div class="home"><span class="fake"></span><span class="mini">${svg(o.bg,o.fg,52)}</span><span class="fake"></span></div>Home screen, 52 dp</div>
</div>`).join('');
Promise.all(['GSF','CMR','CMI','CMS2'].map(f=>document.fonts.load('400 20px '+f,f=='CMS2'?'∫':'a'))).then(()=>document.title='ready');
</script></body></html>
